name: Repair Compose alignment

on:
  push:
    branches:
      - feature/launcher-enhancements

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'Yuska77777'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/launcher-enhancements

      - name: Repair Screens.kt
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/example/gamelauncher/Screens.kt")
          text = path.read_text(encoding="utf-8")

          old = '''        Box(\n            Modifier.align(Alignment.TopEnd).statusBarsPadding().padding(top = 12.dp, end = 12.dp)\n                .size(42.dp).glass(CircleShape).clickable { showSettings = true },'''
          new = '''        Box(\n            Modifier.fillMaxSize().wrapContentSize(Alignment.TopEnd).statusBarsPadding().padding(top = 12.dp, end = 12.dp)\n                .size(42.dp).glass(CircleShape).clickable { showSettings = true },'''

          if old not in text:
              raise SystemExit("Expected Compose alignment block was not found")

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/gamelauncher/Screens.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix Compose settings alignment"
          git push origin HEAD:feature/launcher-enhancements

      - name: Remove temporary repair workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-compose-align.yml || true
          git commit -m "Remove temporary repair workflow" || true
          git push origin HEAD:feature/launcher-enhancements || true
