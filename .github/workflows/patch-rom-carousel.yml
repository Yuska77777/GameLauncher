name: Patch ROM carousel
on:
  push:
    branches: [feature/launcher-enhancements]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact centered ROM carousel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/gamelauncher/RomsScreen.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.ui.platform.LocalContext\n', 'import androidx.compose.ui.platform.LocalConfiguration\nimport androidx.compose.ui.platform.LocalContext\n')
          s = s.replace('    val context = LocalContext.current\n', '    val context = LocalContext.current\n    val configuration = LocalConfiguration.current\n    val rootPagerSidePadding = ((configuration.screenWidthDp.dp - 220.dp) / 2).coerceAtLeast(0.dp)\n    val gamePagerSidePadding = ((configuration.screenWidthDp.dp - 210.dp) / 2).coerceAtLeast(0.dp)\n')
          old = 'contentPadding = PaddingValues(horizontal = 230.dp),\n                    pageSpacing = 18.dp'
          new_root = 'pageSize = androidx.compose.foundation.pager.PageSize.Fixed(220.dp),\n                    contentPadding = PaddingValues(horizontal = rootPagerSidePadding),\n                    pageSpacing = 18.dp'
          if s.count(old) < 1:
              raise SystemExit('root pager pattern not found')
          s = s.replace(old, new_root, 1)
          old_game = 'contentPadding = PaddingValues(horizontal = 230.dp),\n                        pageSpacing = 18.dp'
          new_game = 'pageSize = androidx.compose.foundation.pager.PageSize.Fixed(210.dp),\n                        contentPadding = PaddingValues(horizontal = gamePagerSidePadding),\n                        pageSpacing = 18.dp'
          if s.count(old_game) < 1:
              raise SystemExit('game pager pattern not found')
          s = s.replace(old_game, new_game, 1)
          s = s.replace('Box(Modifier.fillMaxWidth().height(410.dp).clip(shape).glass(shape))', 'Box(Modifier.fillMaxWidth().height(300.dp).clip(shape).glass(shape))', 1)
          s = s.replace('Box(Modifier.fillMaxWidth().height(330.dp).clip(shape).glass(shape))', 'Box(Modifier.fillMaxWidth().height(290.dp).clip(shape).glass(shape))', 1)
          p.write_text(s)
          PY
      - name: Commit and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/gamelauncher/RomsScreen.kt
          git commit -m 'Make ROM carousels compact and centered' || true
          git push origin HEAD:feature/launcher-enhancements
          git rm .github/workflows/patch-rom-carousel.yml
          git commit -m 'Remove temporary ROM carousel patch workflow'
          git push origin HEAD:feature/launcher-enhancements
